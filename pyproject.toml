[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pemr"
version = "0.1.0"
description = "Local-first personal EMR engine — SQLite is the source of truth"
requires-python = ">=3.11"

[project.optional-dependencies]
# The phase-5 MCP wrapper (pemr/mcp_server.py). Optional: the engine, CLI, and the
# wrapper's own tool functions/tests need none of it — only `python -m pemr.mcp_server`
# does. Installed with `pip install pemr[mcp]`.
mcp = ["mcp>=1.0"]

# PDF reading for `--ocr` (issue #70): the embedded text layer, plus rasterizing pages
# that have none so tesseract can OCR them. Optional for the same reason `tesseract`
# itself is a soft dependency — without it `--ocr` on a PDF degrades to a stderr note
# and every other path (including the agent-supplied `--ocr-text-file` default, which
# `AGENTS.md` makes the norm) is unaffected. Installed with `pip install pemr[ocr]`.
ocr = ["PyMuPDF>=1.24"]

[project.scripts]
pemr = "pemr.cli:main"

[tool.setuptools]
packages = ["pemr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
