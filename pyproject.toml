[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pemr"
version = "0.1.0"
description = "Local-first personal EMR engine — SQLite is the source of truth"
requires-python = ">=3.11"

[project.scripts]
pemr = "pemr.cli:main"

[tool.setuptools]
packages = ["pemr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
