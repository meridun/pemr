# Analyte / name synonym dictionary — STARTER (framework, not personal data).
#
# Copy to data/dictionary.toml (gitignored) and grow it for your own records, or
# point at it with `--dictionary` / [paths].dictionary_file. This is the ONE place
# fuzzy medical naming gets pinned down deterministically: norm() maps each synonym
# to a single canonical token so `A1c`, `HbA1c`, `Hemoglobin A1c` all collapse to
# one dedup identity. Agents propose additions; a human approves them.
#
# Keys are matched AFTER norm() lowercases, trims and collapses whitespace AND strips
# parenthetical qualifiers, so write keys in that already-normalized form: lowercase,
# single spaces, and NO parentheses — norm() removes `(HGB)`, `(SPEP)`, `(calculated)`
# etc. before lookup, so `Hemoglobin (HGB)` matches the bare `hemoglobin` key. Seeded
# from common lab-panel headers plus the real-corpus report vocabulary (CMP/CBC panel
# codes, serum free light chains, SPEP); extend as new documents surface new spellings.

[synonyms]
# --- Glycemic ---
"a1c" = "hba1c"
"hb a1c" = "hba1c"
"hemoglobin a1c" = "hba1c"
"glycated hemoglobin" = "hba1c"
"glycosylated hemoglobin" = "hba1c"
"glucose, fasting" = "glucose_fasting"
"fasting glucose" = "glucose_fasting"
"fasting blood glucose" = "glucose_fasting"

# --- Lipids ---
"total cholesterol" = "cholesterol_total"
"cholesterol, total" = "cholesterol_total"
"ldl" = "ldl_cholesterol"
"ldl-c" = "ldl_cholesterol"
"ldl cholesterol" = "ldl_cholesterol"
"hdl" = "hdl_cholesterol"
"hdl-c" = "hdl_cholesterol"
"hdl cholesterol" = "hdl_cholesterol"
"triglycerides" = "triglycerides"
"trig" = "triglycerides"

# --- Thyroid ---
"tsh" = "tsh"
"thyroid stimulating hormone" = "tsh"
"free t4" = "free_t4"
"ft4" = "free_t4"
"free t3" = "free_t3"
"ft3" = "free_t3"

# --- Renal / metabolic ---
"creatinine" = "creatinine"
"cr" = "creatinine"
"crea" = "creatinine"
"egfr" = "egfr"
"estimated gfr" = "egfr"
"bun" = "bun"
"blood urea nitrogen" = "bun"

# --- Hematology ---
"hemoglobin" = "hemoglobin"
"hgb" = "hemoglobin"
"hb" = "hemoglobin"
"hematocrit" = "hematocrit"
"hct" = "hematocrit"
"white blood cell count" = "wbc"
"wbc" = "wbc"
"platelet count" = "platelets"
"platelets" = "platelets"
"plt" = "platelets"

# --- Basic metabolic panel (CMP abbreviations) ---
# Report codes for non-fasting serum chemistries. (Fasting glucose is its own token
# under Glycemic — a bare `Glucose`/`GLUC` reading is not a fasting result.)
"glucose" = "glucose"
"gluc" = "glucose"
"sodium" = "sodium"
"na" = "sodium"
"potassium" = "potassium"
"k" = "potassium"

# --- Vitamins ---
"vitamin d" = "vitamin_d_25oh"
"vitamin d, 25-hydroxy" = "vitamin_d_25oh"
"25-hydroxyvitamin d" = "vitamin_d_25oh"
"vitamin b12" = "vitamin_b12"
"b12" = "vitamin_b12"
"vit b12" = "vitamin_b12"

# --- Myeloma / paraprotein panel (SPEP, serum free light chains) ---
# Serum free light chains, their ratio, the monoclonal spike and the immunoglobulin
# quant / beta-2 microglobulin that track plasma-cell disease. Parenthetical method
# tags like `(SPEP)` are stripped by norm() before this lookup.
"kappa" = "kappa_free_light_chain"
"free kappa light chain" = "kappa_free_light_chain"
"lambda" = "lambda_free_light_chain"
"free lambda light chain" = "lambda_free_light_chain"
"k/l ratio" = "kappa_lambda_ratio"
"kappa/lambda ratio" = "kappa_lambda_ratio"
"m-spike" = "m_spike"
"immunoglobulin g" = "igg"
"immunoglobulin g, qn, serum" = "igg"
"b2 microglobulin" = "beta2_microglobulin"
"beta2 microglobulin" = "beta2_microglobulin"
"beta-2 microglobulin" = "beta2_microglobulin"

# --- observation obs_type conventions ---
# Five obs_type families out of the generic `observation` table. Extraction
# agents should emit:
#   * obs_type='vital'        key=<canonical vital token below>  (blood_pressure ...)
#   * obs_type='condition'    key=<condition name>     value_text=<optional detail>
#   * obs_type='allergy'      key=<allergen>           value_text=<optional reaction>
#   * obs_type='screening'    key=<snake_case screen>  observed_at=<last-done date>  value_text=<freq/next-due>
#   * obs_type='immunization' key=<snake_case vaccine> observed_at=<date given>      value_text=<optional detail>
# The first three drive the phase-4 render layer (master summary / appointment
# brief); "Latest vitals" is the most recent `vital` row per normalized key.
# Screening/immunization have no render section — they feed the future care-gap
# `pemr due` command (phase 7), which owns the canonical screening/vaccine
# vocabulary. Until then there is no dictionary here for them: agents emit
# sensible snake_case tokens and norm() is the interim case/spacing backstop.

# --- Vitals (observation keys) ---
# Canonical observation-key vocabulary — extraction agents should emit these
# tokens as `observation.key` (with obs_type='vital'): blood_pressure, bmi,
# weight, height, temperature, pulse, spo2, respiratory_rate. Underscores in
# input are treated as spaces by norm(), so "blood_pressure" matches "blood pressure".
"blood pressure" = "blood_pressure"
"bp" = "blood_pressure"
"bmi" = "bmi"
"body mass index" = "bmi"
"weight" = "weight"
"body weight" = "weight"
"height" = "height"
"body height" = "height"
"temperature" = "temperature"
"temp" = "temperature"
"body temperature" = "temperature"
"pulse" = "pulse"
"pulse rate" = "pulse"
"heart rate" = "pulse"
"spo2" = "spo2"
"o2 sat" = "spo2"
"oxygen saturation" = "spo2"
"respiratory rate" = "respiratory_rate"
"resp rate" = "respiratory_rate"
