# Analyte / name synonym dictionary — STARTER (framework, not personal data).
#
# Copy to data/dictionary.toml (gitignored) and grow it for your own records, or
# point at it with `--dictionary` / [paths].dictionary_file. This is the ONE place
# fuzzy medical naming gets pinned down deterministically: norm() maps each synonym
# to a single canonical token so `A1c`, `HbA1c`, `Hemoglobin A1c` all collapse to
# one dedup identity. Agents propose additions; a human approves them.
#
# Keys are matched AFTER lowercasing, trimming and whitespace collapse, so write them
# in that already-normalized form: lowercase, single spaces.
#
# PARENTHESES ARE ALLOWED IN KEYS, and that is how you declare a parenthetical to be
# noise (issue #71). A parenthetical qualifier is treated as MEANINGFUL by default —
# `Albumin` and `Albumin (SPEP)` are two different assays off one draw and must keep
# distinct dedup keys — with two escapes:
#
#   * A redundant alias needs no entry at all: `(HGB)`, `(HCT)`, `(PLT)` already map to
#     the same canonical token as their stem, so `Hemoglobin (HGB)` collapses to
#     `hemoglobin` automatically.
#   * Anything else you want collapsed gets a full parenthesized key, e.g.
#     `"m-spike (spep)" = "m_spike"` below.
#
# After adding or changing a key, run `pemr rekey` (dry-run) and then `--apply` to move
# already-stored rows onto the keys the new dictionary derives.
#
# Seeded from common lab-panel headers plus the real-corpus report vocabulary (CMP/CBC
# panel codes, serum free light chains, SPEP); extend as new documents surface new
# spellings.

[synonyms]
# --- Glycemic ---
"a1c" = "hba1c"
"hb a1c" = "hba1c"
"hemoglobin a1c" = "hba1c"
"glycated hemoglobin" = "hba1c"
"glycosylated hemoglobin" = "hba1c"
"glucose, fasting" = "glucose_fasting"
"fasting glucose" = "glucose_fasting"
"fasting blood glucose" = "glucose_fasting"

# --- Lipids ---
"total cholesterol" = "cholesterol_total"
"cholesterol, total" = "cholesterol_total"
"ldl" = "ldl_cholesterol"
"ldl-c" = "ldl_cholesterol"
"ldl cholesterol" = "ldl_cholesterol"
"hdl" = "hdl_cholesterol"
"hdl-c" = "hdl_cholesterol"
"hdl cholesterol" = "hdl_cholesterol"
"triglycerides" = "triglycerides"
"trig" = "triglycerides"

# --- Thyroid ---
"tsh" = "tsh"
"thyroid stimulating hormone" = "tsh"
"free t4" = "free_t4"
"ft4" = "free_t4"
"free t3" = "free_t3"
"ft3" = "free_t3"

# --- Renal / metabolic ---
"creatinine" = "creatinine"
"cr" = "creatinine"
"crea" = "creatinine"
# "(calculated)" is a note about how the number was produced, not a second assay.
"creatinine (calculated)" = "creatinine"
"egfr" = "egfr"
"estimated gfr" = "egfr"
"bun" = "bun"
"blood urea nitrogen" = "bun"
# The stem alone is enough: `Urea Nitrogen (BUN)` is a redundant alias and drops via
# identity() rule 2 once `urea nitrogen` maps here, so it needs no full-label key.
"urea nitrogen" = "bun"

# --- Hematology ---
"hemoglobin" = "hemoglobin"
"hgb" = "hemoglobin"
"hb" = "hemoglobin"
"hematocrit" = "hematocrit"
"hct" = "hematocrit"
"white blood cell count" = "wbc"
"wbc" = "wbc"
"platelet count" = "platelets"
"platelets" = "platelets"
"plt" = "platelets"
"rbc" = "rbc"
"red blood cell count" = "rbc"
"mcv" = "mcv"
"mean corpuscular volume" = "mcv"
"mch" = "mch"
"mean corpuscular hemoglobin" = "mch"
"mchc" = "mchc"
"mean corpuscular hemoglobin concentration" = "mchc"
"rdw" = "rdw"
"red cell distribution width" = "rdw"
"mpv" = "mpv"
"mean platelet volume" = "mpv"

# --- CBC differential ---
# The absolute count and the percentage are two different measurements of one cell
# line, so they get DIFFERENT canonical tokens on purpose — `%` and `(absolute)` are
# qualifier-distinct (issue #71) and must never fuse. Report short codes pair with the
# long forms the CSV prints; the `(absolute)` long forms need full-label keys (rule 1)
# because the parenthetical is meaningful rather than a redundant alias.
# Ambiguous short codes (`Gran`, `LY`, `MO`) and the bare `Lymphs`/`Eos` spellings stay
# unmapped pending per-document verification.
"lym" = "lymphocytes_abs"
"lymphocytes (absolute)" = "lymphocytes_abs"
"neu" = "neutrophils_abs"
"neutrophils (absolute)" = "neutrophils_abs"
"mono" = "monocytes_abs"
"monocytes (absolute)" = "monocytes_abs"
"eo" = "eosinophils_abs"
"eosinophils (absolute)" = "eosinophils_abs"
"bas" = "basophils_abs"
"basophils (absolute)" = "basophils_abs"
# Percent forms. `MONO` (absolute) vs `MON%` (percent) is the asymmetry the corpus
# actually prints — not a typo.
"lym%" = "lymphocytes_pct"
"lymphocytes %" = "lymphocytes_pct"
"neu%" = "neutrophils_pct"
"neutrophils %" = "neutrophils_pct"
"mon%" = "monocytes_pct"
"monocytes %" = "monocytes_pct"
"eo%" = "eosinophils_pct"
"eosinophils %" = "eosinophils_pct"
"bas%" = "basophils_pct"
"basophils %" = "basophils_pct"

# --- Inflammatory markers ---
# ESR (erythrocyte sedimentation rate). Report labels vary by method, but ESR is a
# single assay however the lab names the technique, so every spelling collapses to
# `esr` — including the parenthesized variant, which needs its own full-label key
# now that a parenthetical is meaningful by default.
"esr" = "esr"
"sed rate" = "esr"
"sed rate by modified westergren" = "esr"
"sed rate (modified westergren)" = "esr"
"erythrocyte sedimentation rate" = "esr"

# --- Basic metabolic panel (CMP abbreviations) ---
# Report codes for non-fasting serum chemistries. (Fasting glucose is its own token
# under Glycemic — a bare `Glucose`/`GLUC` reading is not a fasting result.)
"glucose" = "glucose"
"gluc" = "glucose"
"sodium" = "sodium"
"na" = "sodium"
"potassium" = "potassium"
"k" = "potassium"
"chloride" = "chloride"
"cl" = "chloride"
# Total CO2 on a CMP. `bicarbonate`/`HCO3` is deliberately NOT mapped here: it is a
# different assay label and collapsing the two would fuse two rows from one draw.
"co2" = "co2"
"carbon dioxide" = "co2"
# ...which is why the label some reports print in full gets a full-label key (rule 1)
# instead: `CO2 (Bicarbonate)` IS the CMP total CO2, while a bare `Bicarbonate` row is
# left to key on its own.
"co2 (bicarbonate)" = "co2"
"calcium" = "calcium"
"ca" = "calcium"
"magnesium" = "magnesium"
# `mg` is only ever a test name here — units never route through the dictionary.
"mg" = "magnesium"

# --- Liver enzymes / bilirubin ---
"alt" = "alt"
"sgpt" = "alt"
"ast" = "ast"
"sgot" = "ast"
"alk phos" = "alkaline_phosphatase"
"alp" = "alkaline_phosphatase"
"alkaline phosphatase" = "alkaline_phosphatase"
"bili t" = "bilirubin_total"
"total bilirubin" = "bilirubin_total"
"bilirubin, total" = "bilirubin_total"
"ldh" = "ldh"
"lactate dehydrogenase" = "ldh"

# --- Serum protein ---
# A CMP and an SPEP run off the SAME draw both report total protein (`TPro` /
# `Protein, Total`) and albumin (`ALB` / `Albumin`) — different methods, slightly
# different numbers, same person + same collected_at. Mapping `alb`->`albumin` used to
# be unsafe for exactly that reason; issue #71's method-aware key fixed it, since the
# SPEP row's `Albumin (SPEP)` label keys as `albumin (spep)`, distinct from the CMP's
# bare `albumin`.
#
# Total protein IS deliberately fused across the two methods (the SPEP carries the CMP
# total protein forward — same-draw same-value evidence), whereas the separately
# measured SPEP fraction labels (`Protein Electrophoresis Albumin Fraction`, the
# globulin fractions) stay unmapped so they keep keys of their own.
"alb" = "albumin"
"albumin" = "albumin"
"tpro" = "protein_total"
"total protein" = "protein_total"
"protein, total" = "protein_total"
"protein, total (spep)" = "protein_total"
"protein electrophoresis total protein" = "protein_total"
# Urine total protein is a different analyte from the serum one, so it keeps its own
# canonical token; the second key is the comma-spacing variant some reports print.
"protein,total,urine" = "protein_total_urine"
"protein, total, urine" = "protein_total_urine"
"prot, 24hr calculated" = "protein_24hr"
"prot,24hr calculated" = "protein_24hr"

# --- Vitamins ---
"vitamin d" = "vitamin_d_25oh"
"vitamin d, 25-hydroxy" = "vitamin_d_25oh"
"vit d, 25-hydroxy" = "vitamin_d_25oh"
"vit d" = "vitamin_d_25oh"
"25-hydroxyvitamin d" = "vitamin_d_25oh"
"vitamin b12" = "vitamin_b12"
"b12" = "vitamin_b12"
"vit b12" = "vitamin_b12"

# --- Myeloma / paraprotein panel (SPEP, serum free light chains) ---
# Serum free light chains, their ratio, the monoclonal spike and the immunoglobulin
# quant / beta-2 microglobulin that track plasma-cell disease. `(SPEP)` is noise on
# an M-spike (an M-spike only ever comes off an SPEP) but load-bearing on albumin —
# hence the full-label key below rather than a global rule.
"kappa" = "kappa_free_light_chain"
"free kappa light chain" = "kappa_free_light_chain"
"kappa free light chain, serum" = "kappa_free_light_chain"
"kappa free light chains, serum" = "kappa_free_light_chain"
"lambda" = "lambda_free_light_chain"
"free lambda light chain" = "lambda_free_light_chain"
"lambda free light chain, serum" = "lambda_free_light_chain"
"lambda free light chains, serum" = "lambda_free_light_chain"
"k/l ratio" = "kappa_lambda_ratio"
"kappa/lambda ratio" = "kappa_lambda_ratio"
"kappa/lambda free light chain ratio" = "kappa_lambda_ratio"
"m-spike" = "m_spike"
"m-spike (spep)" = "m_spike"
"immunoglobulin g" = "igg"
"immunoglobulin g, qn, serum" = "igg"
"iga" = "iga"
"immunoglobulin a" = "iga"
"immunoglobulin a, qn, serum" = "iga"
"igm" = "igm"
"immunoglobulin m" = "igm"
"immunoglobulin m, qn, serum" = "igm"
"b2 microglobulin" = "beta2_microglobulin"
"beta2 microglobulin" = "beta2_microglobulin"
"beta-2 microglobulin" = "beta2_microglobulin"
"bmg" = "beta2_microglobulin"
# Immunofixation interpretation, urine. Two spellings that differ only by a comma vs a
# colon — punctuation is load-bearing in lab labels (`M-Spike` vs `M-Spike, %`), so the
# normalizer does not strip it and these are enumerated instead.
"ife interpretation, u" = "ife_interpretation_urine"
"ife interpretation:u" = "ife_interpretation_urine"

# --- observation obs_type conventions ---
# Four obs_type families out of the generic `observation` table. Extraction
# agents should emit:
#   * obs_type='vital'        key=<canonical vital token below>  (blood_pressure ...)
#   * obs_type='order'        key=<item/order name>    value_text=<instructions/prescriber>
#   * obs_type='screening'    key=<snake_case screen>  observed_at=<last-done date>  value_text=<freq/next-due>
#   * obs_type='immunization' key=<snake_case vaccine> observed_at=<date given>      value_text=<optional detail>
# Conditions and allergies used to live here too; migration 006 promoted them to the
# typed `condition` / `allergy` tables (record types of their own in commit-extraction,
# with status/criticality/two-date fields the generic shape could not hold) - see
# AGENTS.md MUST rule 3. Nothing in this dictionary applies to them beyond norm().
# vital/order drive the phase-4 render layer (master summary /
# appointment brief); "Latest vitals" is the most recent `vital` row per normalized key.
# The `order` family captures non-medication orders mined from the med-list section
# (DME, outpatient PT, referrals, pre-op consults); `key` is free-text (verbatim item
# name), NOT a canonical token vocabulary — no synonyms are added for it here.
# Screening/immunization have no render section — they feed the future care-gap
# `pemr due` command (phase 7), which owns the canonical screening/vaccine
# vocabulary. Until then there is no dictionary here for them: agents emit
# sensible snake_case tokens and norm() is the interim case/spacing backstop.

# --- Vitals (observation keys) ---
# Canonical observation-key vocabulary — extraction agents should emit these
# tokens as `observation.key` (with obs_type='vital'): blood_pressure, bmi,
# weight, height, temperature, pulse, spo2, respiratory_rate. Underscores in
# input are treated as spaces by norm(), so "blood_pressure" matches "blood pressure".
"blood pressure" = "blood_pressure"
"bp" = "blood_pressure"
"bmi" = "bmi"
"body mass index" = "bmi"
"weight" = "weight"
"body weight" = "weight"
"height" = "height"
"body height" = "height"
"temperature" = "temperature"
"temp" = "temperature"
"body temperature" = "temperature"
"pulse" = "pulse"
"pulse rate" = "pulse"
"heart rate" = "pulse"
"spo2" = "spo2"
"o2 sat" = "spo2"
"oxygen saturation" = "spo2"
"respiratory rate" = "respiratory_rate"
"resp rate" = "respiratory_rate"
